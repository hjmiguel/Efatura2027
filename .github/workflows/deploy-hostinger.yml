name: Build para Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Preparar dist para Apache
        run: |
          rm -f dist/_headers dist/_redirects
          cat > dist/.htaccess <<'HTACCESS'
          # Gestão+ — configuração Apache (Hostinger)

          # Forçar HTTPS
          RewriteEngine On
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

          # Fallback SPA: rotas como /app ou /entrar servem o index.html
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]

          # Cabeçalhos de segurança
          <IfModule mod_headers.c>
            Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set X-Frame-Options "SAMEORIGIN"

            # assetlinks.json (TWA) com o tipo correto
            <FilesMatch "^assetlinks\.json$">
              Header set Content-Type "application/json"
              Header set Cache-Control "no-cache"
            </FilesMatch>

            # Cache longo para os ficheiros com hash
            <FilesMatch "\.(js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>

            # Sem cache para ficheiros que mudam a cada versão
            <FilesMatch "^(index\.html|sw\.js|manifest\.json)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
          </IfModule>
          HTACCESS

      - name: Publicar dist no ramo deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
